# Same-host receiver example. Provision the private webhook and its credential file separately.
route:
  receiver: las-sso-operations
  group_by: [alertname, job, instance]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: las-sso-operations
    webhook_configs:
      - url: http://127.0.0.1:9094/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/las-sso-alert-webhook-token
