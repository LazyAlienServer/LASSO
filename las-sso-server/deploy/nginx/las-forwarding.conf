# Include only inside a single-canonical-host TLS server/location.
# Upstream application ports must be reachable solely through trusted infrastructure.
# Discard client-controlled alternate forwarding metadata before setting one trusted view.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header Host $server_name;
proxy_set_header X-Forwarded-Host $server_name;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
