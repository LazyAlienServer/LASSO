<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>注册 · LazyAlienServer 通行证</title>
  <link rel="stylesheet" href="/assets/passport.css">
  <script type="module" src="/webjars/altcha/3.1.0/dist/main/altcha.min.js"></script>
  <script src="/assets/passport-ui.js" defer></script>
  <script src="/assets/register.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#registration-form">跳到注册表单</a>
  <main class="auth-shell register-shell">
    <section class="brand-panel" aria-labelledby="brand-title">
      <div class="section-index"><span class="target-mark" aria-hidden="true"></span> REGISTER / 02 <i></i></div>
      <div class="brand-copy">
        <h1 id="brand-title">创建你的<br><span>LAS 通行证</span></h1>
      </div>
    </section>

    <section class="auth-card register-card" aria-labelledby="form-title">
      <header class="card-header">
        <span class="icon-frame" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"></circle><path d="M2.5 20c.8-4 3-6 6.5-6s5.7 2 6.5 6M18 7v8M14 11h8"></path></svg>
        </span>
        <div>
          <p id="form-title">CREATE PASSPORT</p>
        </div>
      </header>

      <div id="error-summary" class="status-message error" role="alert" tabindex="-1" hidden>
        <strong>暂时无法创建账号</strong>
        <span id="error-summary-text">请检查表单后重试。</span>
      </div>

      <form id="registration-form" class="auth-form register-form" novalidate>
        <div class="form-grid">
          <div class="field-group">
            <label for="username">用户名 <span aria-hidden="true">*</span></label>
            <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="3–24 位，区分大小写" required aria-describedby="username-error">
            <p id="username-error" class="field-error" aria-live="polite"></p>
          </div>

          <div class="field-group">
            <label for="displayName">显示名称 <span aria-hidden="true">*</span></label>
            <input id="displayName" name="displayName" type="text" autocomplete="nickname" maxlength="64" required aria-describedby="displayName-error">
            <p id="displayName-error" class="field-error" aria-live="polite"></p>
          </div>
        </div>

        <div class="field-group">
          <label for="password">密码 <span aria-hidden="true">*</span></label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" placeholder="至少 12 个字符" required aria-describedby="password-error">
            <button class="icon-button password-toggle" type="button" aria-label="显示密码" aria-pressed="false" data-password-toggle="password">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.5 6.2A10 10 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.3 3M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6a10 10 0 0 0 3-.5"></path></svg>
            </button>
          </div>
          <p id="password-error" class="field-error" aria-live="polite"></p>
        </div>

        <div class="field-group verification-group">
          <div class="field-heading"><label>人机验证 <span aria-hidden="true">*</span></label><span id="captcha-status">正在准备验证…</span></div>
          <div class="captcha-frame" id="captcha-frame" aria-busy="true">
            <altcha-widget id="altcha-widget" name="altcha" auto="off" hide-footer hide-logo></altcha-widget>
          </div>
          <p id="captcha-error" class="field-error" aria-live="polite"></p>
        </div>

        <label class="agreement">
          <input id="agreement" type="checkbox" required>
          <span>我会保存下一步显示的一次性恢复码。</span>
        </label>

        <button id="register-submit" class="primary-button" type="submit" disabled>
          <span class="button-label">创建通行证</span>
          <span class="button-spinner" aria-hidden="true"></span>
          <svg class="button-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"></path></svg>
        </button>
      </form>

      <section id="registration-success" class="recovery-panel" aria-labelledby="recovery-title" tabindex="-1" hidden>
        <div class="success-heading">
          <span class="icon-frame success-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"></path><path d="m9 12 2 2 4-5"></path></svg></span>
          <div><p>IDENTITY CREATED</p><h2 id="recovery-title">保存你的恢复码</h2></div>
        </div>
        <p class="recovery-warning">恢复码只在此处展示一次。请立即复制或下载，并保存在密码管理器等安全位置。</p>
        <ol id="recovery-code-list" class="recovery-code-list" aria-label="一次性恢复码"></ol>
        <div class="recovery-actions">
          <button id="copy-codes" class="secondary-button" type="button">复制全部</button>
          <button id="download-codes" class="secondary-button" type="button">下载文本</button>
          <p id="recovery-action-status" class="recovery-action-status" role="status" aria-live="polite"></p>
        </div>
        <label class="agreement recovery-confirmation">
          <input id="codes-saved" type="checkbox">
          <span>我已经安全保存恢复码，理解离开后无法再次查看。</span>
        </label>
        <a id="continue-login" class="primary-button link-button disabled" href="/login" aria-disabled="true">前往登录 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"></path></svg></a>
      </section>

      <nav class="auth-links single-link" aria-label="账户帮助"><a href="/login">已有通行证？返回登录</a></nav>
    </section>
  </main>
</body>
</html>
