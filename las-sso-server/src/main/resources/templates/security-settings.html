<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>首次修改密码 · LAS 通行证</title>
  <link rel="stylesheet" href="/assets/passport.css">
  <script src="/assets/passport-ui.js" defer></script>
  <script src="/assets/security-settings.js" defer></script>
</head>
<body class="security-page required-change-page">
  <a class="skip-link" href="#security-card">跳到安全设置</a>
  <main class="auth-shell security-shell">
    <section class="brand-panel" aria-labelledby="brand-title">
      <div class="section-index"><span class="target-mark" aria-hidden="true"></span> SECURITY / 03 <i></i></div>
      <div class="brand-copy">
        <h1 id="brand-title">账号安全<br><span th:text="${username}">LAS User</span></h1>
      </div>
    </section>

    <section id="security-card" class="auth-card security-card" aria-labelledby="security-title">
      <header class="card-header">
        <span class="icon-frame" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"></path><path d="M9 12h6M12 9v6"></path></svg>
        </span>
        <div>
          <p id="security-title">ACTIVATE PASSWORD</p>
        </div>
      </header>

      <input id="security-csrf" type="hidden" th:value="${_csrf.token}" th:data-header="${_csrf.headerName}">

      <div id="security-summary" class="status-message error" role="alert" tabindex="-1" hidden>
        <strong>操作未完成</strong>
        <span id="security-summary-text">请检查输入后重试。</span>
      </div>

      <section id="password-panel" class="security-panel" aria-labelledby="security-title">
        <p class="compact-note">当前使用临时密码。完成改密后需要重新登录。</p>
        <form id="password-change-form" class="auth-form security-form" novalidate>
          <div class="field-group">
            <label for="current-credential">临时密码</label>
            <div class="password-field">
              <input id="current-credential" name="currentCredential" type="password" autocomplete="current-password" maxlength="512" required aria-describedby="current-credential-error">
              <button class="icon-button password-toggle" type="button" aria-label="显示密码" aria-pressed="false" data-password-toggle="current-credential">
                <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.5 6.2A10 10 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.3 3M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6a10 10 0 0 0 3-.5"></path></svg>
              </button>
            </div>
            <p id="current-credential-error" class="field-error" aria-live="polite"></p>
          </div>

          <div class="form-grid password-grid">
            <div class="field-group">
              <label for="new-password">新密码</label>
              <div class="password-field">
                <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="512" required aria-describedby="new-password-error">
                <button class="icon-button password-toggle" type="button" aria-label="显示密码" aria-pressed="false" data-password-toggle="new-password">
                  <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                  <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.5 6.2A10 10 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.3 3M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6a10 10 0 0 0 3-.5"></path></svg>
                </button>
              </div>
              <p id="new-password-error" class="field-error" aria-live="polite"></p>
            </div>
            <div class="field-group">
              <label for="confirm-password">确认新密码</label>
              <div class="password-field">
                <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="512" required aria-describedby="confirm-password-error">
                <button class="icon-button password-toggle" type="button" aria-label="显示密码" aria-pressed="false" data-password-toggle="confirm-password">
                  <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
                  <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.5 6.2A10 10 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.3 3M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6a10 10 0 0 0 3-.5"></path></svg>
                </button>
              </div>
              <p id="confirm-password-error" class="field-error" aria-live="polite"></p>
            </div>
          </div>

          <button id="password-submit" class="primary-button" type="submit">
            <span class="button-label">更新密码</span><span class="button-spinner" aria-hidden="true"></span>
            <svg class="button-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"></path></svg>
          </button>
        </form>

        <section id="password-success" class="completion-panel" role="status" tabindex="-1" hidden>
          <span class="icon-frame success-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 12 3 3 7-7"></path><circle cx="12" cy="12" r="9"></circle></svg></span>
          <h2>密码已经更新</h2>
          <p>旧会话和恢复码已失效。请使用新密码重新登录，再生成一批恢复码。</p>
          <a class="primary-button link-button" href="/login">重新登录</a>
        </section>
      </section>

      <nav class="auth-links security-footer-link security-footer-actions" aria-label="账号导航">
        <form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button" type="submit">退出通行证</button></form>
      </nav>
    </section>
  </main>
</body>
</html>
