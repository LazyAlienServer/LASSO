<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light">
  <title>注销账号 · LazyAlienServer 通行证</title><link rel="stylesheet" href="/assets/passport.css">
</head>
<body class="passport-account-page">
  <a class="skip-link" href="#account-content">跳到注销账号</a>
  <div th:replace="~{fragments/account-navigation :: header(${username})}"></div>
  <main class="passport-account-layout">
    <div th:replace="~{fragments/account-navigation :: nav('delete')}"></div>
    <section id="account-content" class="passport-content deletion-content" aria-labelledby="delete-title">
      <div class="passport-section-index danger-index"><span class="target-mark" aria-hidden="true"></span> ACCOUNT / 05 <i></i></div>
      <article class="passport-panel deletion-panel">
        <header class="passport-title-block danger-title">
          <span class="title-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 16h.01"></path><path d="M10.3 3.9 2.6 18a2 2 0 0 0 1.8 3h15.2a2 2 0 0 0 1.8-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg></span>
          <div><p>ACCOUNT DELETION</p><h1 id="delete-title">注销账号</h1><span>申请注销 LazyAlienServer 通行证</span></div>
        </header>
        <div class="deletion-grid">
          <ol class="deletion-steps" aria-label="账号注销流程">
            <li><strong>01</strong><span>退出所有 LAS 应用</span></li>
            <li><strong>02</strong><span>进入 30 天等待期</span></li>
            <li><strong>03</strong><span>到期删除通行证数据</span></li>
          </ol>
          <aside class="deletion-note"><strong>注销不是立即删除</strong><p>业务系统中的历史内容可能按各自规则保留。</p></aside>
        </div>
        <div class="feature-state compact deletion-unavailable">
          <span class="feature-state-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"></path></svg></span>
          <h2>注销申请暂未开放</h2>
          <p>30 天等待期、取消申请、任务执行和全局退出必须作为完整事务上线。目前不接受不完整的注销请求。</p>
          <button type="button" disabled>申请注销通行证</button>
          <a href="/account">返回账户概览</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
