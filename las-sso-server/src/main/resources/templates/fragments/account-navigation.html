<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
  <header class="passport-header" th:fragment="header(username)">
    <a class="passport-brand" href="/account" aria-label="LazyAlienServer 通行证 LAS PASSPORT 个人中心">
      <span class="passport-brand-mark" aria-hidden="true">{;}</span>
      <strong>LazyAlienServer 通行证</strong>
      <span>LAS PASSPORT</span>
    </a>
    <div class="passport-user">
      <span class="passport-user-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.7-4 3-6 7-6s6.3 2 7 6"></path></svg>
      </span>
      <strong th:text="${username}">LAS User</strong>
      <form method="post" action="/logout">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="passport-logout" type="submit">退出</button>
      </form>
    </div>
  </header>

  <nav class="passport-sidebar" aria-label="通行证管理" th:fragment="nav(activePage)">
    <a href="/account" th:classappend="${activePage == 'overview'} ? ' active'" th:attr="aria-current=${activePage == 'overview'} ? 'page' : null">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6"></rect><rect x="14" y="4" width="6" height="6"></rect><rect x="4" y="14" width="6" height="6"></rect><rect x="14" y="14" width="6" height="6"></rect></svg>
      <span>账户概览</span>
    </a>
    <a href="/account/sessions" th:classappend="${activePage == 'sessions'} ? ' active'" th:attr="aria-current=${activePage == 'sessions'} ? 'page' : null">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1"></rect><path d="M8 21h8M12 17v4"></path></svg>
      <span>活动会话</span>
    </a>
    <a href="/account/recovery-codes" th:classappend="${activePage == 'recovery'} ? ' active'" th:attr="aria-current=${activePage == 'recovery'} ? 'page' : null">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7a5 5 0 1 0-4.6 7L12 16h2v2h2v2h3v-3.2l-4.4-4.4"></path><circle cx="8" cy="10" r="1"></circle></svg>
      <span>恢复码</span>
    </a>
    <a href="/account/authorizations" th:classappend="${activePage == 'authorizations'} ? ' active'" th:attr="aria-current=${activePage == 'authorizations'} ? 'page' : null">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"></path><path d="m4 7.5 8 4.5 8-4.5M12 12v9"></path></svg>
      <span>已授权应用</span>
    </a>
    <a href="/account/delete" th:classappend="${activePage == 'delete'} ? ' active danger'" th:attr="aria-current=${activePage == 'delete'} ? 'page' : null">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H4v14h6M14 8l4 4-4 4M8 12h10"></path></svg>
      <span>注销账号</span>
    </a>
    <div class="passport-sidebar-code" aria-hidden="true"><span class="target-mark"></span><b th:text="${#strings.toUpperCase(activePage)}">ACCOUNT</b><i></i></div>
  </nav>
</body>
</html>
