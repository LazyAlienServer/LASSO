<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>恢复密码 · LazyAlienServer 通行证</title>
  <link rel="stylesheet" href="/assets/passport.css">
  <script type="module" src="/webjars/altcha/3.1.0/dist/main/altcha.min.js"></script>
  <script src="/assets/passport-ui.js" defer></script>
  <script src="/assets/password-recovery.js" defer></script>
</head>
<body class="password-recovery-page">
  <a class="skip-link" href="#recovery-credential-form">跳到密码恢复表单</a>
  <main class="auth-shell recovery-shell">
    <section class="brand-panel" aria-labelledby="brand-title">
      <div class="section-index"><span class="target-mark" aria-hidden="true"></span> RECOVERY / 03 <i></i></div>
      <div class="brand-copy">
        <h1 id="brand-title">找回你的<br><span>LAS 通行证</span></h1>
      </div>
    </section>

    <section class="auth-card recovery-card" aria-labelledby="recovery-title">
      <header class="card-header">
        <span class="icon-frame" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"></path><path d="M9 12h6M12 9v6"></path></svg>
        </span>
        <div>
          <p id="recovery-title">RECOVER PASSPORT</p>
          <span id="recovery-step-label">验证恢复码 · 1 / 2</span>
        </div>
      </header>

      <div id="recovery-error" class="status-message error" role="alert" tabindex="-1" hidden>
        <strong>暂时无法继续</strong>
        <span id="recovery-error-text">请检查输入后重试。</span>
      </div>

      <form id="recovery-credential-form" class="auth-form recovery-form" novalidate>
        <div class="field-group">
          <label for="recovery-username">用户名</label>
          <input id="recovery-username" name="username" type="text" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" required aria-describedby="recovery-username-help recovery-username-error" autofocus>
          <p id="recovery-username-help" class="field-help">用户名区分大小写，请按注册时的写法输入。</p>
          <p id="recovery-username-error" class="field-error" aria-live="polite"></p>
        </div>

        <div class="field-group">
          <label for="recovery-code">恢复码或人工恢复凭据</label>
          <input id="recovery-code" name="credential" type="text" autocomplete="one-time-code" maxlength="64" placeholder="LAS-XXXX-XXXX-XXXX 或 LAS-ADMIN-XXXX-XXXX-XXXX" required aria-describedby="recovery-code-error">
          <p id="recovery-code-error" class="field-error" aria-live="polite"></p>
        </div>

        <div id="recovery-captcha-group" class="field-group verification-group" hidden>
          <div class="field-heading"><label>人机验证</label><span id="captcha-status">正在准备验证…</span></div>
          <div class="captcha-frame" id="captcha-frame" aria-busy="true">
            <altcha-widget id="altcha-widget" name="altcha" auto="off" hide-footer hide-logo></altcha-widget>
          </div>
          <p id="captcha-error" class="field-error" aria-live="polite"></p>
        </div>

        <button id="verify-recovery" class="primary-button" type="submit">
          <span class="button-label">验证恢复码</span>
          <span class="button-spinner" aria-hidden="true"></span>
          <svg class="button-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"></path></svg>
        </button>
      </form>

      <form id="recovery-password-form" class="auth-form recovery-form" novalidate hidden>
        <div class="field-group">
          <label for="recovery-new-password">新密码</label>
          <div class="password-field">
            <input id="recovery-new-password" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="recovery-new-password-error">
            <button class="icon-button password-toggle" type="button" aria-label="显示密码" aria-pressed="false" data-password-toggle="recovery-new-password">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.5 6.2A10 10 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.3 3M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6a10 10 0 0 0 3-.5"></path></svg>
            </button>
          </div>
          <p id="recovery-new-password-error" class="field-error" aria-live="polite"></p>
        </div>

        <div class="field-group">
          <label for="recovery-confirm-password">确认新密码</label>
          <div class="password-field">
            <input id="recovery-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="recovery-confirm-password-error">
            <button class="icon-button password-toggle" type="button" aria-label="显示确认密码" aria-pressed="false" data-password-toggle="recovery-confirm-password">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.5 6.2A10 10 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-2.3 3M6.2 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6a10 10 0 0 0 3-.5"></path></svg>
            </button>
          </div>
          <p id="recovery-confirm-password-error" class="field-error" aria-live="polite"></p>
        </div>

        <p class="compact-note">完成后旧密码和现有登录状态会失效；本次恢复码被消耗，其他未使用的恢复码仍然有效。</p>
        <button id="complete-recovery" class="primary-button" type="submit">
          <span class="button-label">设置新密码</span>
          <span class="button-spinner" aria-hidden="true"></span>
          <svg class="button-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"></path></svg>
        </button>
      </form>

      <section id="recovery-complete" class="completion-panel" tabindex="-1" hidden>
        <span class="icon-frame success-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"></path><path d="m9 12 2 2 4-5"></path></svg></span>
        <h2>密码已更新</h2>
        <p>请使用新密码重新登录。其他未使用的恢复码仍然有效；如果怀疑恢复码泄漏，可在账号安全中重新生成。</p>
        <a class="primary-button link-button" href="/login">返回登录 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"></path></svg></a>
      </section>

      <nav id="recovery-footer" class="auth-links single-link" aria-label="账户帮助"><a href="/login">返回登录</a></nav>
    </section>
  </main>
</body>
</html>
