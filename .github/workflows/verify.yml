name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 21 / PostgreSQL / formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Repository checks
        run: python scripts/verify.py repository
      - name: Independent release-tool fixtures
        run: python -m unittest discover -s scripts/tests -v
      - name: Docker availability
        run: docker info
      - name: Build all modules with database coverage
        working-directory: las-sso-server
        run: bash ./gradlew build :las-sso-spring-boot-starter:generatePomFileForStarterPublication :las-sso-spring-boot-starter:generateMetadataFileForStarterPublication -PrequireDatabaseTests=true --no-daemon --console=plain
      - name: Verify test reports
        if: always()
        run: python scripts/verify.py tests --require-no-skips --output las-sso-server/build/test-summary.json
      - name: Retain count-only test summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-summary
          path: las-sso-server/build/test-summary.json
          retention-days: 7

  powershell:
    name: PowerShell and Windows repository checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Repository checks
        run: python scripts/verify.py repository
      - name: Independent release-tool fixtures
        run: python -m unittest discover -s scripts/tests -v
      - name: Parse maintenance scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -LiteralPath 'las-sso-server/scripts' -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell syntax error in $($file.Name)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
